# Общие правила для всех сайтов (подключается в каждый server-блок).
index index.html;
error_page 404 /404.html;
client_max_body_size 110m;  # до 5 файлов по 20 МБ

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }
location / { try_files $uri $uri/ =404; }

# Заявки: в PocketBase пускаем только создание записи в leads
location = /api/collections/leads/records {
    limit_except POST { deny all; }
    proxy_pass http://pocketbase:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location /api/ { return 404; }
location /_/ { return 404; }
