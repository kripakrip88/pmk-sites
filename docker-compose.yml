# VPS сайтов: nginx (статика 11 доменов + SSL) + PocketBase (заявки) + certbot.
services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./dist:/srv/sites:ro
      - ./deploy/nginx/sites.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/pmk-site.conf:/etc/nginx/snippets/pmk-site.conf:ro
      - certs:/etc/letsencrypt:ro
      - acme:/var/www/certbot:ro
    depends_on: [pocketbase]

  pocketbase:
    build: { context: ., dockerfile: deploy/pocketbase/Dockerfile }
    restart: unless-stopped
    env_file: .env
    # админка только через SSH-туннель: ssh -L 8090:127.0.0.1:8090 <vps>
    ports: ["127.0.0.1:8090:8090"]
    volumes:
      - pb_data:/pb/pb_data

  certbot:
    image: certbot/certbot:v4.1.1
    volumes:
      - certs:/etc/letsencrypt
      - acme:/var/www/certbot
    profiles: ["certbot"]

volumes:
  pb_data:
  certs:
  acme:
